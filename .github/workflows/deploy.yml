# 推送到 main 自动构建并发布到 GitHub Pages。
#
# 关键点：
#   - npm ci 用的是仓库里的 package-lock.json，package.json 改了锁文件也要一起提交
#   - 构建时注入 GH_REPO / GITHUB_ACTIONS，vite.config.ts 才会把 base 设成 /<repo>/，
#     否则部署到 https://<user>.github.io/<repo>/ 会白屏
#   - Pages 的源要手动开一次：Settings → Pages → Source 选 "GitHub Actions"。
#     不要用 configure-pages 的 enablement: true 去自动开——那需要 admin 级 token，
#     个人账号下常报 "Resource not accessible by integration" 直接失败。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          GH_REPO: ${{ github.event.repository.name }}
          GITHUB_ACTIONS: true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
